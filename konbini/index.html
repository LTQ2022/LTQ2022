for(i=0;i<DN;i++){var dx=rnd(SX0,SX1);var dy=rnd(0.2,2.0);dpos.set([dx,dy,FZ+1.25,dx,dy+0.18,FZ+1.25],i*6);dv[i]=rnd(3,6);}
var dgeo=new THREE.BufferGeometry();dgeo.setAttribute('position',new THREE.BufferAttribute(dpos,3));
var drips=new THREE.LineSegments(dgeo,new THREE.LineBasicMaterial({color:0xd8ecff,transparent:true,opacity:0.8}));drips.frustumCulled=false;scene.add(drips);
// ripples
var ringGeo=new THREE.RingGeometry(0.8,1.0,24);var ripples=[];
for(i=0;i<70;i++){var rm=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:0xcfe4ff,transparent:true,opacity:0,depthWrite:false}));rm.rotation.x=-Math.PI/2;scene.add(rm);ripples.push({m:rm,t:rnd(0,1),life:rnd(0.5,0.9)});}
function placeRipple(r){var y;if(Math.random()<0.6){var p=puddles[(Math.random()*puddles.length)|0];var a=Math.random()*6.283,s=Math.sqrt(Math.random())*0.8;r.m.position.set(p.x+Math.cos(a)*p.rx*s,p.y+0.005,p.z+Math.sin(a)*p.rz*s);}else{var x=rnd(-10,10),z=rnd(-10,10);var onRoad=(x>5.5||z>5.5);var inShop=(x>SX0&&x<SX1&&z>SZ0&&z<SZ1+1.3)||(x<HX1&&z<HZ1);if(inShop){x=rnd(5.6,10);}y=onRoad?0.012:0.162;if(x>5.5||z>5.5)y=0.012;else if(x<-4.6&&z>-0.8)y=0.012;r.m.position.set(x,y,z);}r.t=0;r.life=rnd(0.45,0.8);}
ripples.forEach(placeRipple);

// ---------- animate ----------
function onResize(){camera.aspect=W.innerWidth/W.innerHeight;camera.updateProjectionMatrix();renderer.setSize(W.innerWidth,W.innerHeight);}
W.addEventListener('resize',onResize);
var clock=new THREE.Clock(),doorT=0,doorState=0;
function animate(){requestAnimationFrame(animate);var dt=Math.min(clock.getDelta(),0.05),T=clock.elapsedTime;
 var a=rgeo.attributes.position.array;
 for(var i=0;i<RN;i++){var o=i*6,d=rv[i]*dt;a[o+1]-=d;a[o+4]-=d;a[o]-=d*0.06;a[o+3]-=d*0.06;
  if(a[o+1]<0){var x=rnd(-RX,RX),z=rnd(-RX,RX),y=RTOP+rnd(0,2);a[o]=x;a[o+1]=y;a[o+2]=z;a[o+3]=x+0.06;a[o+4]=y+RL;a[o+5]=z+0.03;}}
 rgeo.attributes.position.needsUpdate=true;
 var b=dgeo.attributes.position.array;for(i=0;i<DN;i++){var o2=i*6;dv[i]+=9.8*dt;b[o2+1]-=dv[i]*dt;b[o2+4]-=dv[i]*dt;if(b[o2+1]<0.16){var y0=2.15+rnd(0,0.3);b[o2+1]=y0;b[o2+4]=y0+0.18;dv[i]=rnd(0,1);}}
 dgeo.attributes.position.needsUpdate=true;
 for(i=0;i<ripples.length;i++){var r=ripples[i];r.t+=dt/r.life;if(r.t>=1)placeRipple(r);var s=0.03+r.t*0.22;r.m.scale.set(s,s,s);r.m.material.opacity=0.55*(1-r.t);}
 var fl=0.9+0.1*Math.sin(T*23)*Math.sin(T*3.1);if(Math.sin(T*0.7)>0.985)fl=0.55;signMat.color.setScalar(fl);signGlow.material.opacity=0.32*fl;
 // auto door: open every ~9s
 doorT+=dt;var phase=doorT%9;var open=phase>5&&phase<7.5?1:0;doorState+=(open-doorState)*Math.min(1,dt*4);doorL.position.x=-1.16-doorState*0.72;doorR.position.x=-0.34+doorState*0.72;
 puddleMat.opacity=0.72+0.08*Math.sin(T*2.3);
 controls.update();renderer.render(scene,camera);}
animate();
})();
</script></body></html>
