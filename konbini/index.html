<script>(function(){

controls.autoRotate=true;controls.autoRotateSpeed=0.35;controls.rotateSpeed=0.7;controls.zoomSpeed=0.9;

(function(){var d=fitDistance();var dir=new THREE.Vector3(1,0.78,1.12).normalize();camera.position.copy(dir.multiplyScalar(d)).add(controls.target);})();
var idleT=null;controls.addEventListener('start',function(){controls.autoRotate=false;if(idleT)clearTimeout(idleT);});

// ---------- materials & helpers ----------

var OT=0.03;

function cyl(rt,rb,h,mat,x,y,z,seg,ol,parent){var m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||14),M(mat));m.position.set(x,y+h/2,z);if(ol){var r=Math.max(rt,rb);outline(m,1+OT/r,1+2*OT/h,1+OT/r);}(parent||scene).add(m);return m;}

var FONT="'Hiragino Maru Gothic ProN','M PLUS Rounded 1c','Noto Sans CJK JP','Noto Sans JP','Yu Gothic',sans-serif";

function pool(color,w,d,x,y,z,op){var m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshBasicMaterial({map:radial,color:color,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:op||0.4}));m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.renderOrder=3;m.userData.noShadow=true;scene.add(m);return m;}

// ---------- lights ----------

var moon=new THREE.DirectionalLight(0x8c9cff,0.45);moon.position.set(-10,18,6);scene.add(moon);
var lamp=new THREE.SpotLight(0xffa860,4.2,14,1.0,1.0,1.5);lamp.castShadow=true;lamp.shadow.mapSize.set(1024,1024);lamp.shadow.bias=-0.0008;lamp.shadow.camera.near=0.5;lamp.shadow.camera.far=16;scene.add(lamp);scene.add(lamp.target);
var shopFront=new THREE.SpotLight(0xc6fff6,1.8,10,1.05,0.9,1.4);shopFront.castShadow=true;shopFront.shadow.mapSize.set(1024,1024);shopFront.shadow.bias=-0.0008;scene.add(shopFront);scene.add(shopFront.target);

var vend=new THREE.PointLight(0xff6aa8,2.2,5.5,1.6);scene.add(vend);

// ---------- layout constants ----------

var AX0=-4.6,AX1=3.0,AZ0=-R,AZ1=-5.8;    // apartment behind

// ---------- base plinth ----------
var wood=canvasTex(512,64,function(g,w,h){g.fillStyle='#3a261d';g.fillRect(0,0,w,h);for(var i=0;i<40;i++){g.strokeStyle='rgba('+(Math.random()<0.5?'90,60,44':'30,18,14')+','+rnd(0.2,0.6)+')';g.lineWidth=rnd(1,3);g.beginPath();var y=rnd(0,h);g.moveTo(0,y);g.bezierCurveTo(w*0.3,y+rnd(-6,6),w*0.6,y+rnd(-6,6),w,y+rnd(-4,4));g.stroke();}});
var plinth=new THREE.Mesh(new THREE.BoxGeometry(2*R+0.4,1.4,2*R+0.4),toon(0x3a2820));plinth.position.y=-0.75;scene.add(plinth);
var brass=toon(0xd8b066);box(2*R+0.5,0.06,2*R+0.5,brass,0,-0.1,0);box(2*R+0.5,0.06,2*R+0.5,brass,0,-1.42,0);
// little brass name plate on front face
var plate=canvasTex(512,96,function(g,w,h){g.fillStyle='#c9a35a';g.fillRect(0,0,w,h);g.strokeStyle='#7a5a24';g.lineWidth=4;g.strokeRect(6,6,w-12,h-12);g.fillStyle='#4a3412';g.font='bold 40px '+FONT;g.textAlign='center';g.textBaseline='middle';g.fillText('雨夜の街角  ─  No.24',w/2,h/2+2);});

var pl2=plane(3.2,0.6,toonMap(plate));pl2.position.set(R+0.205,-0.72,0);pl2.rotation.y=Math.PI/2;

// ---------- wet mirror ground ----------
var reflector=new THREE.Reflector(new THREE.PlaneGeometry(2*R,2*R),{clipBias:0.003,textureWidth:Math.floor(W.innerWidth*PR*0.5),textureHeight:Math.floor(W.innerHeight*PR*0.5),color:0xc4c8e6});

// asphalt + markings painted into one big texture with puddle holes (alpha)
var PX=100; // px per unit

var puddles=[[7.6,3.2,1.2,0.75],[0.4,7.8,1.7,0.65],[-6.4,8.3,1.3,0.8],[8.0,-5.2,0.9,1.6],[7.8,8.2,1.2,1.0],[-7.4,3.0,1.1,0.7],[-2.0,8.9,0.8,0.5],[8.4,-0.5,0.7,0.5],[3.4,8.4,0.9,0.6]];
var walkPuddles=[[2.4,3.9,0.9,0.5],[-2.0,3.5,0.8,0.45],[4.3,-6.0,0.5,0.9],[-1.0,-7.6,1.1,0.5]];
function blob(g,cx,cy,rx,ry,seed){g.beginPath();var n=18;for(var i=0;i<=n;i++){var a=i/n*Math.PI*2;var r=1+0.18*Math.sin(a*3+seed)+0.1*Math.sin(a*5+seed*2);var x=cx+Math.cos(a)*rx*r,y=cy+Math.sin(a)*ry*r;if(i===0)g.moveTo(x,y);else g.lineTo(x,y);}g.closePath();}
var groundTex=canvasTex(2048,2048,function(g,w,h){
 g.fillStyle='rgba(34,36,56,0.93)';g.fillRect(0,0,w,h);
 for(var i=0;i<26000;i++){g.fillStyle=Math.random()<0.5?'rgba(95,100,140,0.35)':'rgba(10,12,22,0.4)';g.fillRect(Math.random()*w,Math.random()*h,2,2);}
 // wet streaks lowering alpha (glossy)

 for(i=0;i<220;i++){var x=Math.random()*w,y=Math.random()*h;var r=g.createRadialGradient(x,y,0,x,y,rnd(40,160));r.addColorStop(0,'rgba(0,0,0,0.25)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(x-160,y-160,320,320);}
 g.globalCompositeOperation='source-over';
 // markings
 g.fillStyle='rgba(225,230,255,0.92)';
 for(i=0;i<7;i++){g.fillRect(wx(5.95+i*0.62),wz(1.95),0.42*PX,2.3*PX);}            // crosswalk right arm
 for(i=0;i<7;i++){g.fillRect(wx(1.95),wz(5.95+i*0.62),2.3*PX,0.42*PX);}            // crosswalk front arm
 g.fillRect(wx(1.2),wz(5.55),0.28*PX,2.1*PX);                                        // stop line
 g.save();g.translate(wx(-0.4),wz(6.65));g.rotate(-Math.PI/2);g.font='bold '+(1.25*PX)+'px '+FONT;g.textAlign='center';g.textBaseline='middle';g.fillText('止まれ',0,0);g.restore();
 g.fillStyle='rgba(245,205,110,0.9)';
 for(i=0;i<5;i++)g.fillRect(wx(-9.4+i*2.2),wz(7.75)-6,1.2*PX,12);
 for(i=0;i<4;i++)g.fillRect(wx(7.75)-6,wz(-9.6+i*2.2),12,1.2*PX);
 // parking lot lines (lot x[-10.2,-4.6] z[-0.8,5.4])
 g.fillStyle='rgba(225,230,255,0.85)';[-9.6,-7.3,-5.0].forEach(function(x){g.fillRect(wx(x)-5,wz(-0.6),10,3.9*PX);});g.fillRect(wx(-9.6),wz(-0.6)-5,4.6*PX,10);
 g.font='bold 60px '+FONT;g.textAlign='center';g.fillText('P',wx(-8.45),wz(4.6));g.fillText('P',wx(-6.15),wz(4.6));
 // curb gutters

 g.fillStyle='rgba(120,126,160,0.9)';for(i=0;i<200;i++){g.fillRect(wx(-4.6)+i*5,wz(5.42)+3,2,16);}for(i=0;i<312;i++){g.fillRect(wx(5.42)+3,wz(-R)+i*5,16,2);}
 // puddles: strong alpha cut -> mirror shows
 g.globalCompositeOperation='destination-out';
 puddles.forEach(function(p,k){blob(g,wx(p[0]),wz(p[1]),p[2]*PX,p[3]*PX,k*1.7);g.fillStyle='rgba(0,0,0,0.97)';g.fill();blob(g,wx(p[0]),wz(p[1]),p[2]*PX*1.15,p[3]*PX*1.15,k*1.7);g.fillStyle='rgba(0,0,0,0.25)';g.fill();});
 g.globalCompositeOperation='source-over';
});
var groundMat=new THREE.MeshToonMaterial({map:groundTex,gradientMap:grad,transparent:true,depthWrite:false});
var groundPlane=plane(2*R,2*R,groundMat);groundPlane.rotation.x=-Math.PI/2;groundPlane.position.y=0.008;groundPlane.receiveShadow=true;groundPlane.renderOrder=1;groundPlane.userData.keepShadow=true;

// sidewalks: solid curbs, semi-wet tile tops
var tileTex=canvasTex(1024,1024,function(g,w,h){g.fillStyle='rgba(118,122,158,0.9)';g.fillRect(0,0,w,h);for(var i=0;i<6000;i++){g.fillStyle=Math.random()<0.5?'rgba(190,195,225,0.25)':'rgba(60,62,90,0.25)';g.fillRect(Math.random()*w,Math.random()*h,2,2);}g.strokeStyle='rgba(55,58,85,0.8)';g.lineWidth=3;for(i=0;i<=w;i+=64){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke();}
 g.globalCompositeOperation='destination-out';for(i=0;i<60;i++){var x=Math.random()*w,y=Math.random()*h;var r=g.createRadialGradient(x,y,0,x,y,rnd(30,110));r.addColorStop(0,'rgba(0,0,0,0.5)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(x-110,y-110,220,220);}});
tileTex.wrapS=tileTex.wrapT=THREE.RepeatWrapping;
var curbMat=toon(0xb9bdd2);
function sidewalk(x0,x1,z0,z1){var w=x1-x0,d=z1-z0;var t=tileTex.clone();t.needsUpdate=true;t.repeat.set(w/10.24*1.6,d/10.24*1.6);var top=new THREE.MeshToonMaterial({map:t,gradientMap:grad,transparent:true,depthWrite:true});
 var m=new THREE.Mesh(new THREE.BoxGeometry(w,0.16,d),[curbMat,curbMat,top,curbMat,curbMat,curbMat]);m.position.set((x0+x1)/2,0.08,(z0+z1)/2);m.renderOrder=2;scene.add(m);return m;}
sidewalk(-4.6,ROAD,SZ1,ROAD);sidewalk(SX1,ROAD,-R,SZ1);sidewalk(-6.2,-4.6,-R,SZ1);sidewalk(-4.6,SX1,AZ1,SZ0);
// sidewalk puddles: separate dark mirror-ish discs
var refl=canvasTex(256,256,function(g,w,h){g.fillStyle='#3a4378';g.fillRect(0,0,w,h);var cs=['255,120,180','90,220,255','255,190,110','170,255,235'];for(var i=0;i<16;i++){var x=Math.random()*w;var gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba('+cs[i%4]+',0)');gr.addColorStop(0.5,'rgba('+cs[i%4]+',0.75)');gr.addColorStop(1,'rgba('+cs[i%4]+',0)');g.fillStyle=gr;g.fillRect(x,0,rnd(3,12),h);}});
var walkPudMat=new THREE.MeshBasicMaterial({map:refl,transparent:true,opacity:0.75,depthWrite:false});walkPudMat.userData.noShadow=true;
walkPuddles.forEach(function(p,k){var sh=new THREE.Shape();var n=16;for(var i=0;i<n;i++){var a=i/n*Math.PI*2;var r=1+0.18*Math.sin(a*3+k)+0.1*Math.sin(a*5+k*2);var x=Math.cos(a)*p[2]*r,z=Math.sin(a)*p[3]*r;if(i===0)sh.moveTo(x,z);else sh.lineTo(x,z);}var m=new THREE.Mesh(new THREE.ShapeGeometry(sh),walkPudMat);m.rotation.x=-Math.PI/2;m.position.set(p[0],0.165,p[1]);m.renderOrder=3;scene.add(m);});

// ---------- convenience store ----------
var WALL=0xdcdff0,FRAME=0x3d4260;
box(SWD,0.1,SZ1-SZ0,emis(0xdfeeee,0.55),SCX,0.16,(SZ0+SZ1)/2);   // bright floor
box(SWD,SH,0.18,WALL,SCX,0,SZ0+0.09,true);
box(0.18,SH,SZ1-SZ0,WALL,SX0+0.09,0,(SZ0+SZ1)/2,true);
box(0.18,SH,SZ1-SZ0,WALL,SX1-0.09,0,(SZ0+SZ1)/2,true);
box(SWD+0.24,0.22,SZ1-SZ0+0.24,0xc3c7da,SCX,SH,(SZ0+SZ1)/2,true);
box(SWD+0.24,0.32,0.1,0xb4b8cc,SCX,SH+0.22,SZ0-0.07,true);box(0.1,0.32,SZ1-SZ0+0.24,0xb4b8cc,SX0-0.07,SH+0.22,(SZ0+SZ1)/2,true);box(0.1,0.32,SZ1-SZ0+0.24,0xb4b8cc,SX1+0.07,SH+0.22,(SZ0+SZ1)/2,true);
box(1.0,0.55,0.75,0xa9aec4,-2.8,SH+0.22,-3.6,true);box(0.75,0.45,0.75,0xa9aec4,1.6,SH+0.22,-3.9,true);
// ---------- interior (bright, warm, packed) ----------
var ceil=box(SWD-0.3,0.04,SZ1-SZ0-0.3,emis(0xfff4e2,0.6),SCX,SH-0.06,(SZ0+SZ1)/2);
for(var i=0;i<4;i++)box(SWD-0.8,0.03,0.18,emis(0xffffff,1.3),SCX,SH-0.1,-0.4-i*1.25);
var inLight=new THREE.PointLight(0xfff0d8,0.9,5.5,1.6);inLight.position.set(-0.7,2.9,-2.2);scene.add(inLight);
var inLight2=new THREE.PointLight(0xfff0d8,0.5,4,1.6);inLight2.position.set(1.8,2.9,-1.0);scene.add(inLight2);
var floorTex=canvasTex(256,256,function(g,w,h){g.fillStyle='#f4f1ea';g.fillRect(0,0,w,h);g.strokeStyle='rgba(150,150,170,.35)';g.lineWidth=2;for(var i=0;i<=w;i+=32){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke();}});
floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping;floorTex.repeat.set(4,3);
box(SWD-0.36,0.02,SZ1-SZ0-0.36,new THREE.MeshBasicMaterial({map:floorTex,color:0xd8d4cc}),SCX,0.265,(SZ0+SZ1)/2);
var PAL=[0xff6b8b,0x58c4ff,0xffd05a,0x7fe39a,0xb99cff,0xff9a52,0xffffff,0xff4d5e,0x3e7bff,0x9be7ff,0xfff1a8,0x6ad0a0];
var prodMat=new THREE.MeshBasicMaterial({color:0xffffff});
var GBOX=new THREE.BoxGeometry(1,1,1),GCYL=new THREE.CylinderGeometry(0.5,0.5,1,10),GCUP=new THREE.CylinderGeometry(0.5,0.4,1,10);
GBOX.translate(0,0.5,0);GCYL.translate(0,0.5,0);GCUP.translate(0,0.5,0);
function instSet(list,parent){var by={};list.forEach(function(it){(by[it.g]=by[it.g]||[]).push(it);});var dm=new THREE.Object3D(),col=new THREE.Color();
 Object.keys(by).forEach(function(k){var arr=by[k];var geo=k==='b'?GBOX:k==='c'?GCYL:GCUP;var im=new THREE.InstancedMesh(geo,prodMat,arr.length);
  arr.forEach(function(it,i){dm.position.set(it.x,it.y,it.z);dm.scale.set(it.sx,it.sy,it.sz);dm.rotation.set(0,it.r||0,0);dm.updateMatrix();im.setMatrixAt(i,dm.matrix);col.setHex(it.c).multiplyScalar(it.k||0.9);im.setColorAt(i,col);});
