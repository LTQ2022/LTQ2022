  camera.lookAt(camLook); if (!crashed) camera.rotateZ(st.lean * 0.18);

  hudSpd.textContent = Math.round(kmh); hudMode.textContent = mode; hudMode.className = mode === 'S' ? 'boost' : ''; hudBat.textContent = Math.round(st.batt) + '%'; hudLean.textContent = crashed ? '—' : st.pitch > 0.08 ? ('翘头 ' + Math.round(st.pitch * 57.3) + '°') : ('倾角 ' + Math.round(Math.abs(st.lean) * 57.3) + '°');

  dashT += dt; if (dashT > 0.15) { dashT = 0; drawDash(kmh, Math.round(st.batt), mode); }

}
function grav0(p) { return 12.0 * Math.cos(p + 0.35); }
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

drawDash(0, 100, 'D');
if (CFG.simple) { const fix = () => scene.traverse(o => { if (o.material && o.material.isMeshPhysicalMaterial) { const m = o.material; o.material = new THREE.MeshStandardMaterial({ color: m.color, roughness: m.roughness, metalness: m.metalness, map: m.map }); } }); fix(); setTimeout(fix, 3000); }

  dbg2() { const v = new THREE.Vector3(); riderBones.Spine.getWorldPosition(v); const h = new THREE.Vector3(); riderBones.Head.getWorldPosition(h); const b = new THREE.Vector3(); bikeBody.getWorldPosition(b); return { spine: v.toArray(), head: h.toArray(), body: b.toArray(), q: bike.quaternion.toArray() }; },
  dbg3() { return [bikeRB.quaternion.toArray().map(x=>+x.toFixed(2)), bikeRB.angularVelocity.toArray().map(x=>+x.toFixed(2)), bikeRB.position.toArray().map(x=>+x.toFixed(2)), bikeRB.sleepState, world.bodies.length]; },
