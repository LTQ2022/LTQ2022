<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D 地球</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at center,#0b1736 0%,#03060f 55%,#000 100%)}
#map{position:absolute;inset:0;background:transparent}
#stars{position:absolute;inset:0;pointer-events:none}
.maplibregl-ctrl-attrib{font-size:10px;opacity:.55}
#lab{position:absolute;right:12px;bottom:28px;z-index:5;background:rgba(10,14,26,.6);color:#dfe8ff;border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:7px 13px;font:13px/1 system-ui,sans-serif;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
</style></head><body>
<canvas id="stars"></canvas><div id="map"></div>
<button id="lab">地名 关</button>
<script>
(function(){var c=document.getElementById('stars'),g=c.getContext('2d');function d(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.clearRect(0,0,c.width,c.height);for(var i=0;i<500;i++){var r=Math.random()*1.3*devicePixelRatio;g.fillStyle='rgba(255,255,255,'+(0.3+Math.random()*0.7)+')';g.beginPath();g.arc(Math.random()*c.width,Math.random()*c.height,r,0,7);g.fill();}}d();addEventListener('resize',d);})();
var map=new maplibregl.Map({
 container:'map',
 style:{version:8,
  projection:{type:'globe'},
  sources:{
   sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'},
   dem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],encoding:'terrarium',tileSize:256,maxzoom:14},
   lbl:{type:'raster',tiles:['https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19}
  },
  layers:[{id:'sat',type:'raster',source:'sat',paint:{'raster-fade-duration':200}},
          {id:'lbl',type:'raster',source:'lbl',layout:{visibility:'none'}}],
  sky:{'atmosphere-blend':['interpolate',['linear'],['zoom'],0,1,5,1,7,0],'sky-color':'#6aa8ff','horizon-color':'#cfe4ff','fog-color':'#cfe4ff','sky-horizon-blend':0.5,'horizon-fog-blend':0.6,'fog-ground-blend':0.3}
 },
 center:[120,25],zoom:Math.min(innerWidth,innerHeight)<600?1.15:1.8,maxZoom:19,minZoom:0.5,
 attributionControl:{compact:true},
 maxPitch:80,
 renderWorldCopies:false
});
map.touchZoomRotate.enableRotation();
var spinning=true,last=performance.now();
function spin(t){var dt=(t-last)/1000;last=t;if(spinning&&map.getZoom()<4&&!map.isMoving()){var c=map.getCenter();c.lng-=dt*4;map.jumpTo({center:c});}requestAnimationFrame(spin);}
map.on('load',function(){requestAnimationFrame(spin);});
['mousedown','touchstart','wheel'].forEach(function(e){map.getCanvasContainer().addEventListener(e,function(){spinning=false;},{passive:true});});
var lab=document.getElementById('lab'),on=false;
lab.onclick=function(){on=!on;map.setLayoutProperty('lbl','visibility',on?'visible':'none');lab.textContent='地名 '+(on?'开':'关');};
map.on('error',function(e){console.log('maperr',e&&e.error&&e.error.message);});
window.__map=map;
</script></body></html>
